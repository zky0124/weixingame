name: 资料检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 检查文档、单位与图鉴
        run: node 工具/检查项目资料.cjs
      - name: 验证科技树规划与导入规则
        run: |
          node 工具/验证科技规划器.cjs
          node 工具/验证科技树存档.cjs
      - name: 验证首战数据与战斗逻辑
        run: |
          npm ci --prefix 游戏工程
          npm test --prefix 游戏工程
      - name: 检查差异格式
        run: git diff --check
