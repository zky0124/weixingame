<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛮荒开拓 · 本地试玩</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#172b25;color:#f0dfb6;font:16px system-ui,sans-serif}header{padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,a{font:inherit;border:1px solid #728574;border-radius:8px;padding:10px 14px;background:#2b493b;color:#f0dfb6;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#efc66a;color:#27392d}p{margin:0;padding:0 24px 16px;color:#b7c8a5}main{padding:16px;overflow:auto}iframe{display:block;margin:auto;border:2px solid #728574;border-radius:12px;background:#193d32}small{display:block;padding:0 24px 16px;color:#b7c8a5}
</style>
<header><h1>蛮荒开拓 · 首战程序原型</h1><button data-w="1280" data-h="720" aria-pressed="true">电脑 1280×720</button><button data-w="640" data-h="360">小手机 640×360</button><button data-w="844" data-h="390">宽屏手机 844×390</button><button data-w="1024" data-h="768">平板 1024×768</button><button data-w="390" data-h="844">竖屏提示</button><a href="/" target="_blank">独立窗口试玩</a></header>
<p>首战 → 国王赠款 → 主城升级 → 选农田并在网格上选址 → 确认建造 → 继续迎敌。双击哥布林可集火，设置内可清空重开。</p>
<small>已接入首批建筑美术，角色和地形仍为程序占位。尺寸切换不重开战斗；它不代替真机触控、安全区与性能测试。</small>
<main><iframe id="game" title="可玩游戏" src="/" width="1280" height="720" allow="fullscreen"></iframe></main>
<script>
  const frame=document.querySelector('#game');
  document.querySelectorAll('button[data-w]').forEach(button=>button.addEventListener('click',()=>{
    frame.width=button.dataset.w;frame.height=button.dataset.h;
    document.querySelectorAll('button[data-w]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  }));
</script>
</html>
