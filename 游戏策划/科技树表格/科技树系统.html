<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究塔 · 科技树系统</title>
<style>
:root{color-scheme:dark;--bg:#101b24;--panel:#182732;--line:#314450;--gold:#e8c27d;--text:#e4e9e5;--muted:#a1b4bf}*{box-sizing:border-box}body{margin:0;font:14px/1.55 "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--text);background:#233744;border:1px solid #48606c;border-radius:7px;padding:9px 13px}button:hover{background:#304958}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.gold{background:var(--gold);color:#1e2c34;border-color:var(--gold);font-weight:700}.gold:hover{background:#f3d69f}header{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 24px;border-bottom:1px solid var(--line);background:#15232d}h1{margin:0;font-size:21px;letter-spacing:1px;color:var(--gold)}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100dvh - 82px);min-height:500px}.map{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#253747 0,#162530 47%,#0e1a24 100%);isolation:isolate}.map:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#b8cde329 1px,transparent 1px);background-size:32px 32px;pointer-events:none}.map.panning{cursor:grabbing}.world{position:absolute;width:1px;height:1px;transform-origin:0 0}.edges{position:absolute;width:1px;height:1px;overflow:visible;pointer-events:none}.tech{position:absolute;width:150px;min-height:79px;transform:translate(-50%,-50%);border:1px solid var(--branch);border-top:3px solid var(--branch);background:linear-gradient(155deg,#253845,#182834);box-shadow:0 7px 18px #0004;border-radius:11px;padding:12px 10px;text-align:center;user-select:none;touch-action:none}.tech:hover{background:#2c4351}.tech.selected{border-color:var(--gold);box-shadow:0 0 0 3px #e8c27d2a,0 0 32px #e8c27d26}.tech strong{display:block;font-size:15px;line-height:1.5}.tech small{display:block;font-size:11px;color:var(--branch);margin-top:6px}.tech .code{font-size:10px;color:#a4b4bf;position:absolute;right:7px;top:-19px}.tech.root{width:154px;height:154px;min-height:0;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(#3e4952,#243744 65%,#1b2d38);box-shadow:0 0 0 12px #d9b16d0c,0 0 0 15px #bca67b26,0 0 60px #b4935630;padding:18px 12px}.root svg{width:62px;height:61px;display:block;margin:0 auto 2px}.root strong{font-size:18px;color:var(--gold)}.root small{margin-top:2px;color:#b7b8a8}.map-head{position:absolute;z-index:2;top:19px;left:22px;right:20px;pointer-events:none}.map-head span{font-size:11px;color:var(--gold);letter-spacing:3px}.map-head h2{font-size:17px;font-weight:400;margin:6px 0;color:#bdcbd0}.map-foot{position:absolute;z-index:2;bottom:18px;left:20px;right:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}.map-foot p{margin:0;max-width:380px;font-size:12px;color:#aec1cd;background:#101c26c9;padding:9px 12px;border-radius:6px}.map-tools{pointer-events:auto;display:flex;align-items:center;gap:6px;background:#13212bec;padding:6px;border:1px solid #38505c;border-radius:8px}.map-tools button{padding:5px 10px}.map-tools output{min-width:46px;text-align:center;font-size:12px}.side{overflow-y:auto;border-left:1px solid var(--line);background:linear-gradient(155deg,#1c2d37,#16252f);padding:22px 22px 28px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px}.side h2{margin:4px 0 2px;font-size:22px}.sub{margin:0 0 18px;color:var(--muted);font-size:12px}.field{display:block;margin:0 0 14px}.field>span{display:block;color:#bacad1;font-size:12px;margin-bottom:5px}input,textarea,select{width:100%;background:#111f29;color:#ecf0ec;border:1px solid #3c5360;border-radius:6px;padding:9px 10px;min-height:40px}textarea{resize:vertical;min-height:84px;line-height:1.7}input[type=color]{padding:3px;height:40px}input[readonly]{color:#9bb0be}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:var(--muted);margin:8px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:-28px;background:#16252ff5;border-top:1px solid #344b57;padding:14px 0}.danger{color:#efaea3}.feedback{min-height:22px;color:#c4d8c2;font-size:12px;flex-basis:100%}.feedback.error{color:#ffb5a6}details{border-top:1px solid #344854;margin-top:18px;padding-top:14px}summary{cursor:pointer;color:#d4dcd8;margin-bottom:14px}#fileInput{display:none}.empty{text-align:center;padding:40px 10px}#storageStatus{max-width:330px;font-size:11px;color:var(--muted)}@media(max-width:1050px){header{align-items:flex-start;padding:12px 16px}.toolbar{justify-content:flex-end}.layout{height:calc(100dvh - 112px);grid-template-columns:minmax(0,1fr) 330px}.side{padding:18px 15px}button{padding:8px 10px}.map-head h2{font-size:14px}}@media(max-width:700px){header{flex-direction:column;gap:9px}.toolbar{justify-content:flex-start}.layout{display:flex;flex-direction:column;height:auto;min-height:0}.map{height:65dvh;min-height:410px}.side{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-bottom:40px}.map-head h2{display:none}.map-foot p{max-width:190px;font-size:10px}.actions{bottom:0}.map-tools{gap:3px}.map-tools button{padding:6px 9px}}@media(prefers-reduced-motion:no-preference){.tech{transition:box-shadow .15s,border-color .15s}}[hidden]{display:none!important}
</style></head><body>
<style>button{white-space:nowrap}@media(max-width:700px){.actions{position:static}}</style>
<header><div><h1>科技树系统</h1><p>用分支规划成长路线，所有效果由你填写。</p></div><nav class="toolbar" aria-label="科技树工具"><button id="addBranch">＋ 新建分支</button><button id="connect">连线</button><button id="saveProject" class="gold">保存到项目</button><button id="loadProject">载入项目</button><button id="undo">撤销</button><button id="arrange">整理布局</button><button id="import">导入规划</button><button id="backup">备份文本</button><button id="export" class="gold">保存为 JSON</button></nav></header>
<main class="layout"><section id="map" class="map" aria-label="放射状科技地图"><div class="map-head"><span>TECHNOLOGY ATLAS</span><h2 id="mapTitle">研究塔与它的成长分支</h2></div><div id="world" class="world"><svg id="edges" class="edges" aria-hidden="true"></svg><div id="nodes"></div></div><div class="map-foot"><p>点科技看详情 · 拖科技调整位置<br>空白处拖动 · 滚轮 / 双指缩放</p><div class="map-tools"><button id="zoomOut" aria-label="缩小">−</button><output id="zoom">100%</output><button id="zoomIn" aria-label="放大">＋</button><button id="fit">全览</button></div></div></section>
<aside class="side" aria-label="科技详情"><div class="eyebrow">科技详情与升级条件</div><h2 id="selectedTitle">研究塔</h2><p id="selectionMeta" class="sub"></p><form id="editor">
<label class="field"><span>科技名称</span><input name="name" maxlength="120" required></label>
<div class="pair"><label class="field"><span>分支名称</span><input name="branch" maxlength="120"></label><label class="field"><span>分支颜色</span><input name="color" type="color"></label></div>
<div class="pair"><label class="field"><span>最高等级</span><input name="level" type="number" min="1" step="1"></label><label class="field"><span>研究点消耗</span><input name="points" type="number" min="0" step="any" placeholder="未确定留空"></label></div>
<div class="pair"><label class="field"><span>铜币消耗</span><input name="coins" type="number" min="0" step="any" placeholder="未确定留空"></label><label class="field"><span>研究耗时（秒）</span><input name="seconds" type="number" min="0" step="any" placeholder="0表示立即"></label></div>
<label class="field"><span>具体效果与数值</span><textarea name="effect" rows="4" placeholder="例如：护卫护甲增加1；解锁护卫队长……"></textarea></label>
<label class="field" id="parentField"><span>上游科技点（主路径）</span><select name="parent"></select></label>
<div id="dependencyList" class="hint"></div><label class="field"><span>城镇 / 研究塔等级 / 其他条件</span><textarea name="conditions" rows="2" placeholder="例如：定居点、研究塔2级"></textarea></label>
<details><summary>解锁内容与更多条件</summary><label class="field"><span>额外前置科技编号（逗号分隔）</span><input name="requires" placeholder="例如：T001,T003"></label><label class="field"><span>前置条件关系</span><select name="mode"><option value="all">全部满足</option><option value="any">任一满足</option></select></label><label class="field"><span>作用 / 解锁兵种与进阶路线</span><textarea name="units" rows="2"></textarea></label><label class="field"><span>解锁建筑</span><textarea name="buildings" rows="2"></textarea></label><label class="field"><span>对已有单位如何生效</span><input name="existing" placeholder="现有单位、新招募单位、英雄、召唤物……"></label><label class="field"><span>设定状态</span><input name="status" placeholder="用户已确定 / 工作初稿 / 待填写"></label><label class="field"><span>备注</span><textarea name="notes" rows="3"></textarea></label></details>
<p class="hint">空白表示还没确定，0表示明确不消耗。这里只规划设计，不会直接扣除游戏资源。</p>
<div class="actions"><button type="submit" class="gold">保存科技点</button><button type="button" id="addChild">＋ 下一级</button><button type="button" id="remove" class="danger">删除</button><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="storageStatus">正在读取本机草稿…</div></div>
</form></aside></main><dialog id="backupDialog" style="width:min(760px,94vw);background:#182732;color:#e4e9e5;border:1px solid #526b76;border-radius:12px;padding:24px"><h2>规划数据备份</h2><p>也可以复制下方全部内容，保存成UTF-8编码的.json文件，再通过“导入规划”打开。</p><textarea id="backupText" aria-label="规划JSON文本" readonly style="height:48vh;font:12px/1.5 monospace"></textarea><p><button id="selectBackup">全选文本</button> <button id="closeBackup">关闭</button></p></dialog><input type="file" id="fileInput" accept=".json,application/json"><script src="科技树初始数据.js"></script><script src="科技树模型.js"></script><script src="科技树系统.js"></script></body></html>
